<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi rutina</title>
<style>
  :root {
    --bg:#FDF6EA; --texto:#3B2F1E; --suave:#9A8A6E; --borde:#EADFC8;
    --card:#FFFFFF; --anilloTrack:#F0E4CE; --stepperBg:#FFFFFF; --stepperBtn:#FDF6EA;
    --chipOnBg:#3B2F1E; --chipOnFg:#FFD966; --inputBg:#FFFFFF; --inputFg:#3B2F1E; --inputPh:#C9BCA0;
    --verde:#2E7D52; --alerta:#B35900;
  }
  [data-tema="oscuro"] {
    --bg:#221A10; --texto:#F5EAD8; --suave:#B3A184; --borde:#4A3A22;
    --card:#2E2315; --anilloTrack:#3A2E1C; --stepperBg:rgba(0,0,0,.28); --stepperBtn:#1A140B;
    --chipOnBg:#FFD966; --chipOnFg:#241A0F; --inputBg:#F5EAD8; --inputFg:#241A0F; --inputPh:#B3A184;
    --verde:#6FCF97; --alerta:#FFB74D;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; color:var(--texto); background:var(--bg); padding-bottom:80px; transition:background .2s,color .2s; }
  header { padding:18px 16px 12px; }
  .saludo { display:flex; align-items:center; gap:12px; }
  h1 { font-size:20px; margin:0; }
  .sub { font-size:12.5px; color:var(--suave); }
  .anillo { margin-left:auto; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; }
  .anillo b { width:42px; height:42px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-size:12.5px; }
  .btnIcono { border:1px solid var(--borde); background:var(--card); border-radius:12px; padding:8px 11px; font-size:15px; cursor:pointer; color:var(--texto); }
  .guardarWrap { position:relative; }
  .menu { position:absolute; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--borde); border-radius:12px; box-shadow:0 4px 14px rgba(60,40,10,.18); min-width:215px; padding:6px; display:none; z-index:30; }
  .menu.ver { display:block; }
  .menu button { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--texto); padding:10px 12px; font-size:13.5px; border-radius:9px; cursor:pointer; }
  .menu button:active { background:var(--anilloTrack); }
  .faseNav { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:14px; padding:10px 14px; margin:16px 0 10px; box-shadow:0 1px 3px rgba(120,90,40,.10); font-size:13.5px; font-weight:600; }
  .flecha { border:none; background:transparent; color:var(--suave); font-size:18px; cursor:pointer; padding:0 2px; }
  .faseNav .tag { margin-left:auto; font-size:11px; background:var(--anilloTrack); color:var(--suave); padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .sems { display:flex; gap:8px; margin-bottom:12px; }
  .sem { flex:1; text-align:center; background:var(--card); border:none; border-radius:12px; padding:9px 0; font-size:13px; color:var(--suave); box-shadow:0 1px 3px rgba(120,90,40,.08); cursor:pointer; }
  .sem.on { background:var(--chipOnBg); color:var(--chipOnFg); font-weight:700; }
  main { padding:10px 12px; }
  .dia-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .dia-tab { flex:1; border:none; border-radius:12px; padding:10px 0; font-size:13px; font-weight:700; cursor:pointer; background:var(--card); color:var(--suave); border-top:4px solid var(--c); }
  .dia-tab.on { background:var(--cc); color:var(--texto); }
  .bloque { border-radius:16px; padding:14px; margin-bottom:12px; }
  .bloque h2 { font-size:13.5px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
  .bloque .meta { font-weight:400; font-size:11px; opacity:.65; }
  .ej { background:rgba(255,255,255,.8); border-radius:12px; padding:11px 12px; margin-bottom:7px; }
  [data-tema="oscuro"] .ej { background:rgba(0,0,0,.28); }
  .fila1 { display:flex; align-items:center; gap:8px; }
  .ej a { color:var(--texto); text-decoration:none; font-weight:600; font-size:13.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .delta { font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .delta.up { background:rgba(46,125,82,.14); color:var(--verde); }
  .delta.down { background:rgba(179,89,0,.12); color:var(--alerta); }
  .delta.same { background:var(--anilloTrack); color:var(--suave); }
  .metaPill { font-size:11px; font-weight:700; color:var(--suave); background:var(--anilloTrack); padding:4px 8px; border-radius:8px; white-space:nowrap; }
  .fila2 { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .stepper { display:flex; align-items:center; gap:2px; background:var(--stepperBg); border-radius:11px; padding:4px; box-shadow:inset 0 0 0 1px var(--borde); flex:1; min-width:0; }
  .stepper button { width:38px; height:36px; border:none; border-radius:9px; background:var(--stepperBtn); color:var(--texto); font-size:18px; font-weight:700; cursor:pointer; }
  .stepper input { flex:1; min-width:0; text-align:center; border:none; background:transparent; font-size:17px; font-weight:700; color:var(--texto); }
  .stepper input::placeholder, .reps::placeholder { color:var(--inputPh); font-weight:500; }
  .reps { width:64px; text-align:center; border:none; border-radius:11px; padding:10px 0; font-size:16px; font-weight:700; background:var(--inputBg); color:var(--inputFg); box-shadow:inset 0 0 0 1px var(--borde); flex-shrink:0; }
  input:focus { outline:2px solid #F6B26B; }
  .guardado { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--verde); color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .guardado.ver { opacity:1; }
  .aviso { background:#FCE5CD; border-radius:10px; padding:8px 10px; font-size:11.5px; margin-bottom:10px; color:#8A5A1E; }
  [data-tema="oscuro"] .aviso { background:rgba(246,178,107,.12); color:#F6B26B; }
  .pie { font-size:12px; color:var(--suave); padding:0 16px; }
</style>
</head>
<body>
<header>
  <div class="saludo">
    <div>
      <h1 id="titDia">💪</h1>
      <div class="sub" id="subDia"></div>
    </div>
    <div class="anillo" id="anillo"><b id="anilloTxt"></b></div>
    <div class="guardarWrap">
      <button class="btnIcono" onclick="toggleMenu()" title="Respaldo y carga">💾</button>
      <div class="menu" id="menuGuardar">
        <button onclick="cerrarMenu(); exportar()">⬇ Descargar respaldo</button>
        <button onclick="cerrarMenu(); document.getElementById('imp').click()">⬆ Cargar respaldo</button>
        <button onclick="cerrarMenu(); traerAnterior()">⤵ Copiar semana anterior</button>
      </div>
    </div>
    <button class="btnIcono" id="temaBtn" onclick="toggleTema()" title="Cambiar tema">🌙</button>
  </div>
  <div class="faseNav">
    <button class="flecha" id="fasePrev" title="" onclick="setFase(iFase-1)">‹</button>
    <span id="faseLbl"></span>
    <button class="flecha" id="faseNext" title="" onclick="setFase(iFase+1)">›</button>
    <span class="tag" id="faseTag"></span>
  </div>
  <div class="sems" id="semanas"></div>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(event)">
</header>
<main id="app"></main>
<p class="pie">Tocá el nombre para ver el video. Si cambiás el peso entre series, escribilos separados con / (ej: 40/40/42,5). Lo gris con "(sem ant)" es lo de la semana anterior: tocá + para confirmarlo. 💾 respalda y restaura todo.</p>
<div class="guardado" id="guardado">Guardado ✓</div>

<script>
const EJ = [
  // ── CAMBIAR EJERCICIOS (al arrancar un mes nuevo) ─────────────────
  // Editá acá directamente. Cada línea:
  // { d: día ("A"|"B"|"C"), b: "Bloque|descanso", n: "nombre", u: "link video",
  //   t: { f1:"3 × 10", f2:"4 × 6", f3:"4 × 6" },  f:"f2" (solo en fases 2-3, ej: bisagra) }
  // La carga de kg/reps queda atada al nombre (n): si cambiás el nombre, arranca de cero.
  // ────────────────────────────────────────────────────────────────────
  // DÍA A
  {d:"A", b:"Principal|2-3 min de descanso", n:"Prensa de piernas", u:"https://www.youtube.com/watch?v=bNsrqXUIJqc", t:{f1:"3 × 10",f2:"4 × 6", f3:"4 × 6"}},
  {d:"A", b:"Superserie 1 · banco|90 s al cerrar el par", n:"1A · Press de banca con mancuernas", u:"https://www.youtube.com/watch?v=TAH8RxOS0VI", t:{f1:"3 × 10",f2:"4 × 6", f3:"4 × 6"}},
  {d:"A", b:"Superserie 1 · banco|90 s al cerrar el par", n:"1B · Remo a una mano en el banco", u:"https://www.youtube.com/watch?v=Pkr1WW3p05A", t:{f1:"3 × 10 por lado",f2:"3 × 8-12 por lado", f3:"3 × 8-12 por lado"}},
  {d:"A", b:"Superserie 2 · jalón|90 s al cerrar el par", n:"2A · Jalón al pecho", u:"https://www.youtube.com/watch?v=72q0tKij5uU", t:{f1:"3 × 10",f2:"3 × 8-12", f3:"3 × 8-12"}},
  {d:"A", b:"Superserie 2 · jalón|90 s al cerrar el par", n:"2B · Elevaciones laterales", u:"https://www.youtube.com/watch?v=hgLpdwMtEEs", t:{f1:"3 × 12",f2:"3 × 12-15", f3:"3 × 12-15"}},
  {d:"A", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Aductores en máquina", u:"https://www.youtube.com/watch?v=9EuO_mMQ3i8", t:{f1:"2 × 12",f2:"2 × 12-15", f3:"2 × 12-15"}},
  {d:"A", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Dead bug", u:"https://www.youtube.com/watch?v=XkTtXA3-IqU", t:{f1:"3 × 8 por lado",f2:"3 × 10 por lado", f3:"3 × 10 por lado"}},
  {d:"A", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Gemelo de pie", u:"https://www.youtube.com/watch?v=R9eS_1An8L0", t:{f1:"3 × 12",f2:"3 × 12-15", f3:"3 × 12-15"}},
  // DÍA B
  {d:"B", b:"Escalón de bisagra|3 × 5 liviano, al inicio (solo sem 3-6)", f:"f2", n:"Escalón 1 · Peso muerto con kettlebell", u:"https://www.youtube.com/watch?v=Jc9KDxhc_68", t:{f2:"3 × 5", f3:"3 × 5"}},
  {d:"B", b:"Principal|2-3 min de descanso", n:"Hip thrust", u:"https://www.youtube.com/watch?v=14wE63cK26I", t:{f1:"3 × 10",f2:"4 × 6", f3:"4 × 6"}},
  {d:"B", b:"Superserie 1|90 s al cerrar el par", n:"1A · Dominadas asistidas", u:"https://www.youtube.com/watch?v=lgE47t3dr2Q", t:{f1:"3 × 8",f2:"4 × 6", f3:"4 × 6"}},
  {d:"B", b:"Superserie 1|90 s al cerrar el par", n:"1B · Pájaros con mancuernas", u:"https://www.youtube.com/watch?v=24z3h_bZ7Zo", t:{f1:"3 × 12",f2:"3 × 12-15", f3:"3 × 12-15"}},
  {d:"B", b:"Superserie 2|90 s al cerrar el par", n:"2A · Press inclinado con mancuernas", u:"https://www.youtube.com/watch?v=qhKStczz27Q", t:{f1:"3 × 10",f2:"3 × 8-12", f3:"3 × 8-12"}},
  {d:"B", b:"Superserie 2|90 s al cerrar el par", n:"2B · Curl inclinado", u:"https://www.youtube.com/watch?v=ZY19YNmm7tQ", t:{f1:"3 × 10",f2:"3 × 10-12", f3:"3 × 10-12"}},
  {d:"B", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Plancha Copenhague corta (rodilla)", u:"https://www.youtube.com/watch?v=QBweBJRxmrY", t:{f1:"3 × 15 s por lado",f2:"3 × 20-30 s por lado", f3:"3 × 20-30 s por lado"}},
  {d:"B", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Pallof press en polea", u:"https://www.youtube.com/watch?v=o_CxFP4FJhA", t:{f1:"3 × 10 por lado",f2:"3 × 12 por lado", f3:"3 × 12 por lado"}},
  {d:"B", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Gemelo sentado en máquina (sóleo)", u:"https://www.youtube.com/watch?v=rfkYC-mbQus", t:{f1:"3 × 12",f2:"3 × 12-15", f3:"3 × 12-15"}},
  // DÍA C
  {d:"C", b:"Principal|2-3 min de descanso", n:"Sentadilla búlgara con mancuernas", u:"https://www.youtube.com/watch?v=Xfa3Ql_NwmE", t:{f1:"3 × 10 por pierna",f2:"4 × 6-8 por pierna", f3:"4 × 6-8 por pierna"}},
  {d:"C", b:"Superserie 1|90 s al cerrar el par", n:"1A · Press de hombro sentado con mancuernas", u:"https://www.youtube.com/watch?v=GELRUlUSxeI", t:{f1:"3 × 10",f2:"4 × 6", f3:"4 × 6"}},
  {d:"C", b:"Superserie 1|90 s al cerrar el par", n:"1B · Curl martillo", u:"https://www.youtube.com/watch?v=9fcdEnbcm10", t:{f1:"3 × 10",f2:"3 × 10-12", f3:"3 × 10-12"}},
  {d:"C", b:"Superserie 2|90 s al cerrar el par", n:"2A · Curl femoral en máquina", u:"https://www.youtube.com/watch?v=H_ADCsf0JOw", t:{f1:"3 × 10",f2:"3 × 10-12", f3:"3 × 10-12"}},
  {d:"C", b:"Superserie 2|90 s al cerrar el par", n:"2B · Extensión de tríceps sobre la cabeza", u:"https://www.youtube.com/watch?v=fQ-KB40W3d8", t:{f1:"3 × 10",f2:"3 × 10-15", f3:"3 × 10-15"}},
  {d:"C", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Plancha lateral", u:"https://www.youtube.com/watch?v=bRivOELQVOs", t:{f1:"3 × 20 s por lado",f2:"3 × 30-45 s por lado", f3:"3 × 30-45 s por lado"}},
  {d:"C", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Bird dog", u:"https://www.youtube.com/watch?v=O1HWwhYmQGE", t:{f1:"3 × 8 por lado",f2:"3 × 10 por lado", f3:"3 × 10 por lado"}},
  {d:"C", b:"Prevención · circuito|60 s al cerrar la ronda", n:"Elevación de tibial contra la pared", u:"https://www.youtube.com/watch?v=UVh1ztx8kZI", t:{f1:"2 × 15",f2:"2 × 20", f3:"2 × 20"}},
];
const DIAS = {
  A:{n:"Día A", titulo:"Día A · Prensa + empuje", c:"#ffd966", lClaro:"#fff2cc", lOscuro:"rgba(255,217,102,.10)"},
  B:{n:"Día B", titulo:"Día B · Cadera + tirón", c:"#f6b26b", lClaro:"#fce5cd", lOscuro:"rgba(246,178,107,.10)"},
  C:{n:"Día C", titulo:"Día C · Unilateral + hombro", c:"#e06666", lClaro:"#f4cccc", lOscuro:"rgba(224,102,102,.12)"},
};
const FASES = [{id:"f1", n:"Semanas 1-2", sems:[1,2]}, {id:"f2", n:"Semanas 3-4", sems:[3,4]}, {id:"f3", n:"Semanas 5-6", sems:[5,6]}];
const KEY = "rutina.v1";
let st = JSON.parse(localStorage.getItem(KEY) || "{}");
let iFase = st._fase ? FASES.findIndex(f=>f.id===st._fase) : 0; if (iFase<0) iFase=0;
let semana = st._semana || FASES[iFase].sems[0];
let dia = "A";
const $ = id => document.getElementById(id);
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const kOf = id => `${id}.s${semana}`;
const num = v => parseFloat(String(v).replace(",", "."));
const fmt = v => v.toLocaleString("es-AR");
const seriesKg = v => String(v||"").split("/").map(x => num(x.trim())).filter(x => !isNaN(x) && x > 0); // "40/42,5" → [40, 42.5]
const oscuro = () => document.documentElement.dataset.tema === "oscuro";
function datosEnFase(f){
  const F = FASES.find(x=>x.id===f); let n = 0;
  for (const e of EJ) for (const s of F.sems) {
    const d = st[`${e.n}.s${s}`]; if (d && ((d.kg||"").trim() || (d.reps||"").trim())) n++;
  }
  return n;
}
function baseKg(id, s){
  if (s % 4 === 1) return null; // arranque de mes: arrancás vacío
  const d = st[`${id}.s${s-1}`];
  if (d && (d.kg||"").trim() && seriesKg(d.kg).length) return { sem: s-1, kg: String(d.kg).trim() };
  return null;
}
function textoCmp(id, v){
  const base = baseKg(id, semana);
  if (!base) return { txt:"", full:"", cls:"" };
  const acts = seriesKg(v), ants = seriesKg(base.kg);
  if (!acts.length) return { txt:"", full:`Base sem ${base.sem}: ${base.kg} kg`, cls:"" };
  if (!ants.length) return { txt:"", full:"", cls:"" };
  const full = `Serie a serie vs sem ${base.sem}: ${base.kg} → ${String(v).trim()} kg`;
  let sube = 0, baja = 0;
  const n = Math.min(acts.length, ants.length);
  for (let i = 0; i < n; i++) {
    const d = Math.round((acts[i] - ants[i]) * 100) / 100;
    if (d > sube) sube = d;
    if (d < baja) baja = d;
  }
  if (baja < 0) return { txt:`⚠️ −${fmt(Math.abs(baja))}`, full, cls:"down" };
  if (sube > 0) return { txt:`⬆️ +${fmt(sube)}`, full, cls:"up" };
  return { txt:`➖ =${fmt(ants[0])}`, full, cls:"same" };
}
function cmpId(id){ return "cmp-" + id.replace(/[^a-z0-9]/gi, "_"); }
function updateAnillo(){
  const F = FASES[iFase], D = DIAS[dia];
  const ejDia = EJ.filter(x => x.d === dia && (!x.f || (x.f === "f2" && F.id !== "f1")));
  const conCarga = ejDia.filter(e => { const g = st[`${e.n}.s${semana}`]; return g && ((g.kg||"").trim() || (g.reps||"").trim()); }).length;
  const pct = ejDia.length ? (conCarga / ejDia.length) * 100 : 0;
  $("anillo").style.background = `conic-gradient(${D.c} 0 ${pct}%, var(--anilloTrack) ${pct}% 100%)`;
  $("anilloTxt").textContent = `${conCarga}/${ejDia.length}`;
}
function setVal(id, campo, v){
  st[kOf(id)] = st[kOf(id)] || {}; st[kOf(id)][campo] = v; save();
  if (campo === "kg") {
    const c = $(cmpId(id));
    if (c) { const t = textoCmp(id, v); c.textContent = t.txt; c.className = "delta " + t.cls; c.title = t.full; c.style.display = t.txt ? "" : "none"; }
  }
  updateAnillo();
  const g = $("guardado"); g.classList.add("ver");
  clearTimeout(window._t); window._t = setTimeout(()=>g.classList.remove("ver"), 1200);
}
function paso(btn, delta){
  const inp = btn.parentElement.querySelector("input");
  const id = inp.dataset.ej;
  if (inp.value.trim() === "") { // primer toque: deja la base lista (todas las series de la sem ant)
    inp.value = (baseKg(id, semana) || {kg:"20"}).kg;
    setVal(id, "kg", inp.value);
    return;
  }
  inp.value = inp.value.split("/").map(x => { // sube/baja todas las series juntas
    let n = num(x); if (isNaN(n)) n = 0;
    n = Math.round((n + delta) * 100) / 100; if (n < 0) n = 0;
    return String(n).replace(".", ",");
  }).join("/");
  setVal(id, "kg", inp.value);
}
function colorBloque(tit){
  const o = oscuro();
  if (tit.startsWith("Principal")) return o ? "rgba(255,217,102,.10)" : "#FFF2CC";
  if (tit.startsWith("Prevención")) return o ? "rgba(224,102,102,.12)" : "#F4CCCC";
  return o ? "rgba(246,178,107,.10)" : "#FCE5CD"; // superseries y bisagra
}
function setDia(d){ dia = d; render(); window.scrollTo(0,0); }
function setSemana(s){ semana = s; st._semana = s; save(); render(); }
function setFase(i){
  iFase = (i + FASES.length) % FASES.length;
  semana = FASES[iFase].sems[0]; st._fase = FASES[iFase].id; st._semana = semana;
  save(); render();
}
function toggleTema(){
  const osc = oscuro();
  document.documentElement.dataset.tema = osc ? "claro" : "oscuro";
  st._tema = document.documentElement.dataset.tema; save();
  $("temaBtn").textContent = osc ? "🌙" : "☀️";
  render();
}
function toggleMenu(){ $("menuGuardar").classList.toggle("ver"); }
function cerrarMenu(){ $("menuGuardar").classList.remove("ver"); }
function traerAnterior(){
  const prev = semana - 1; if (prev < 1) return alert("No hay semana anterior.");
  let n = 0;
  for (const e of EJ) for (const c of ["kg","reps"]) {
    const origen = st[`${e.n}.s${prev}`];
    if (origen && origen[c] !== undefined && origen[c] !== "") {
      st[kOf(e.n)] = st[kOf(e.n)] || {}; st[kOf(e.n)][c] = origen[c]; n++;
    }
  }
  save(); render(); alert(`Copié ${n} datos de la semana ${prev}.`);
}
function exportar(){
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(st, null, 1));
  a.download = "rutina-respaldo.json"; a.click();
}
function importar(ev){
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { st = JSON.parse(r.result); save(); aplicarTema(); render(); alert("Respaldo cargado ✓"); } catch(e){ alert("Archivo inválido"); } };
  r.readAsText(f); ev.target.value = "";
}
function aplicarTema(){
  document.documentElement.dataset.tema = st._tema || "claro";
  $("temaBtn").textContent = oscuro() ? "☀️" : "🌙";
}
function render(){
  const F = FASES[iFase];
  const otros = FASES[(iFase + 1) % FASES.length];
  const dOtros = datosEnFase(otros.id) > 0 ? `${datosEnFase(otros.id) === 1 ? "1 dato" : datosEnFase(otros.id) + " datos"}` : "sin datos";
  const dFase = datosEnFase(F.id);
  $("faseLbl").textContent = F.n;
  $("faseLbl").title = `${dFase === 1 ? "1 dato" : dFase + " datos"} cargados en ${F.n}`;
  $("faseTag").textContent = dFase === 0 ? "sin datos" : `${dFase === 1 ? "1 dato" : dFase + " datos"}`;
  $("fasePrev").title = `Ir a ${otros.n} (${dOtros})`;
  $("faseNext").title = `Ir a ${otros.n} (${dOtros})`;
  $("semanas").innerHTML = F.sems.map(s =>
    `<button class="sem ${s===semana?"on":""}" onclick="setSemana(${s})">Sem ${s}</button>`).join("");
  const D = DIAS[dia];
  $("titDia").textContent = D.n + " 💪";
  $("subDia").textContent = D.titulo.split("·").slice(1).join("·").trim() + " · " + F.n;
  updateAnillo();
  let html = `<div class="dia-tabs">` + Object.keys(DIAS).map(d => {
    const DD = DIAS[d];
    return `<button class="dia-tab ${d===dia?"on":""}" style="--c:${DD.c};--cc:${oscuro()?DD.lOscuro:DD.lClaro}" onclick="setDia('${d}')" title="${DD.titulo}">${DD.n}</button>`;
  }).join("") + `</div>`;
  if (semana === 1) html += `<div class="aviso">🟡 Semana 1: hacé solo <b>2 series por ejercicio</b>.</div>`;
  if (dia === "B" && F.id !== "f1") html += `<div class="aviso">🟠 Antes del hip thrust: escalón de bisagra 3 × 5 liviano. Subís de escalón tras 3 sesiones con buena técnica y sin molestar la lumbar.</div>`;
  if (F.id === "f3") html += `<div class="aviso">🔴 Arranca el 2do mes: si cambiaste ejercicios en el código, arrancás con los campos vacíos. Si todo subió bien, en la semana 7 entra el desarrollo (y el día D).</div>`;
  let bloqueActual = null;
  const ejDia = EJ.filter(x => x.d === dia && (!x.f || (x.f === "f2" && F.id !== "f1")));
  for (const e of ejDia) {
    if (e.b !== bloqueActual) {
      if (bloqueActual !== null) html += `</div>`;
      bloqueActual = e.b;
      const [tit, meta] = e.b.split("|");
      html += `<div class="bloque" style="background:${colorBloque(tit)}"><h2>${tit}<span class="meta">${meta||""}</span></h2>`;
    }
    const guardado = st[kOf(e.n)] || {};
    const base = baseKg(e.n, semana);
    const t = textoCmp(e.n, guardado.kg || "");
    const prev = semana % 4 === 1 ? {} : (st[`${e.n}.s${semana-1}`] || {}); // arranque de mes: sin semana anterior
    const repsConsigna = (e.t[F.id].split("×")[1]||"").replace("por lado","").replace("por pierna","").trim();
    const repsPh = String(prev.reps || "").trim() ? `${String(prev.reps).trim()} (sem ant)` : repsConsigna;
    html += `<div class="ej">
      <div class="fila1">
        <a href="${e.u}" target="_blank">${e.n}</a>
        <span class="metaPill">${e.t[F.id]}</span>
        <span class="delta ${t.cls}" id="${cmpId(e.n)}" title="${t.full}" ${t.txt?"":'style="display:none"'}>${t.txt}</span>
      </div>
      <div class="fila2">
        <div class="stepper">
          <button onclick="paso(this,-2.5)">−</button>
          <input type="text" autocomplete="off" data-ej="${e.n.replace(/"/g,"&quot;")}" placeholder="${base ? `${base.kg} (sem ant)` : ""}" value="${(guardado.kg||"").replace(/"/g,"&quot;")}" oninput="setVal('${e.n.replace(/'/g,"\\'")}','kg',this.value)">
          <button onclick="paso(this,2.5)">+</button>
        </div>
        <input class="reps" type="text" inputmode="numeric" placeholder="${repsPh}" value="${(guardado.reps||"").replace(/"/g,"&quot;")}" oninput="setVal('${e.n.replace(/'/g,"\\'")}','reps',this.value)">
      </div>
    </div>`;
  }
  html += `</div>`;
  $("app").innerHTML = html;
}
aplicarTema();
render();
</script>
</body>
</html>
